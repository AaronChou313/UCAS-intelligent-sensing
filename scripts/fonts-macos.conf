<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
<dir>/System/Library/Fonts</dir>
<dir>/System/Library/Fonts/Supplemental</dir>
<dir>/Library/Fonts</dir>
<dir>~/Library/Fonts</dir>
<cachedir>/tmp/ucas-font-cache</cachedir>
<alias><family>SimSun</family><prefer><family>Songti SC</family><family>Hiragino Sans GB</family></prefer></alias>
<alias><family>SimHei</family><prefer><family>Heiti SC</family><family>Hiragino Sans GB</family></prefer></alias>
<alias><family>Microsoft YaHei</family><prefer><family>Hiragino Sans GB</family></prefer></alias>
<alias><family>sans-serif</family><prefer><family>Arial</family><family>Hiragino Sans GB</family></prefer></alias>
</fontconfig>
