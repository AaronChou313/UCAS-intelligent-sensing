<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="ultrasoundpatht ultrasoundpathd"><title id="ultrasoundpatht">回波传播为什么要除以二</title><desc id="ultrasoundpathd">发射器到目标再返回接收器构成两段路径。往返时间t对应2d，若传播速度c已知则距离d等于ct除以2。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><rect x="40" y="90" width="170" height="100" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="125" y="147" font-size="19" text-anchor="middle">收发器</text><rect x="610" y="60" width="60" height="165" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="640" y="149.5" font-size="19" text-anchor="middle">目标</text><path d="M210 110L610 110" stroke="currentColor" fill="none" stroke-width="2" /><path d="M602 105L610 110L602 115" fill="none" stroke="currentColor" stroke-width="2"/><path d="M610 180L210 180" stroke="currentColor" fill="none" stroke-width="2" /><path d="M218 185L210 180L218 175" fill="none" stroke="currentColor" stroke-width="2"/><text fill="currentColor" x="410" y="86" font-size="19" text-anchor="middle">去程 d</text><text fill="currentColor" x="410" y="215" font-size="19" text-anchor="middle">回程 d</text><text fill="currentColor" x="400" y="285" font-size="19" text-anchor="middle">总路程 2d = ct；单程与往返时间不能混用。</text></svg>
