<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="tdoat tdoad"><title id="tdoat">到达时间差与距离差</title><desc id="tdoad">声源到两麦克风距离分别r1和r2。定义tau=t2-t1，则c tau=r2-r1。本图只表示声程差，不额外引入有方向的角度约定。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><circle cx="410" cy="60" r="8" fill="var(--figure-orange,#a95d17)"/><circle cx="200" cy="230" r="7" fill="currentColor"/><circle cx="600" cy="230" r="7" fill="currentColor"/><path d="M410 60L200 230" stroke="var(--figure-blue,#17657a)" fill="none" stroke-width="2" /><path d="M410 60L600 230" stroke="var(--figure-blue,#17657a)" fill="none" stroke-width="2" /><path d="M200 230L600 230" stroke="currentColor" fill="none" stroke-width="2" /><text fill="currentColor" x="410" y="35" font-size="19" text-anchor="middle">声源</text><text fill="currentColor" x="160" y="270" font-size="19" text-anchor="middle">麦克风1</text><text fill="currentColor" x="640" y="270" font-size="19" text-anchor="middle">麦克风2</text><text fill="currentColor" x="270" y="130" font-size="19" text-anchor="middle">r₁</text><text fill="currentColor" x="540" y="130" font-size="19" text-anchor="middle">r₂</text><text fill="currentColor" x="400" y="257" font-size="19" text-anchor="middle">间距 d</text><text fill="currentColor" x="400" y="315" font-size="19" text-anchor="middle">τ = t₂ − t₁；先定义符号，再解释方向。</text></svg>
