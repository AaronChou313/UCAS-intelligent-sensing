<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="measurementchaint measurementchaind"><title id="measurementchaint">角度怎样成为估计值</title><desc id="measurementchaind">示意流程，不按物理比例。角度改变敏感元件，经过电路和ADC产生读数，再通过标定模型得到角度估计。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><rect x="25" y="55" width="135" height="60" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="92.5" y="92" font-size="19" text-anchor="middle">被测角度 x</text><path d="M160 85L200 85" stroke="currentColor" fill="none" stroke-width="2" /><path d="M192 80L200 85L192 90" fill="none" stroke="currentColor" stroke-width="2"/><rect x="200" y="55" width="150" height="60" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="275" y="92" font-size="19" text-anchor="middle">敏感元件 R(x)</text><path d="M350 85L390 85" stroke="currentColor" fill="none" stroke-width="2" /><path d="M382 80L390 85L382 90" fill="none" stroke="currentColor" stroke-width="2"/><rect x="390" y="55" width="150" height="60" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="465" y="92" font-size="19" text-anchor="middle">调理与电压</text><path d="M540 85L580 85" stroke="currentColor" fill="none" stroke-width="2" /><path d="M572 80L580 85L572 90" fill="none" stroke="currentColor" stroke-width="2"/><rect x="580" y="55" width="190" height="60" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="675" y="92" font-size="19" text-anchor="middle">ADC 数字读数 y</text><path d="M680 115L680 200" stroke="currentColor" fill="none" stroke-width="2" /><path d="M680 200L490 200" stroke="currentColor" fill="none" stroke-width="2" /><path d="M498 205L490 200L498 195" fill="none" stroke="currentColor" stroke-width="2"/><rect x="270" y="170" width="220" height="60" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="380" y="207" font-size="19" text-anchor="middle">标定 / 反演得到 x̂</text><text fill="currentColor" x="400" y="285" font-size="19" text-anchor="middle">读数的数字化，不等于被测量已经准确恢复。</text></svg>
