<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="correlationdelayt correlationdelayd"><title id="correlationdelayt">相关峰的符号来自移位约定</title><desc id="correlationdelayd">有限序列零延拓。x在n为1处为1，y在n为3处为1，按rxy(lag)等于x(n)y(n加lag)求和，峰在正2。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><text fill="currentColor" x="400" y="30" font-size="19" text-anchor="middle">已知脉冲延迟2个采样，先用它核对lag符号</text><text fill="currentColor" x="40" y="115" font-size="19" text-anchor="middle">x[n]</text><path d="M110 110L420 110" stroke="currentColor" fill="none" stroke-width="2" /><path d="M140 110L140 110" stroke="var(--figure-blue,#17657a)" fill="none" stroke-width="2" /><text fill="currentColor" x="140" y="136" font-size="16" text-anchor="middle">0</text><path d="M215 110L215 55" stroke="var(--figure-blue,#17657a)" fill="none" stroke-width="2" /><text fill="currentColor" x="215" y="136" font-size="16" text-anchor="middle">1</text><path d="M290 110L290 110" stroke="var(--figure-blue,#17657a)" fill="none" stroke-width="2" /><text fill="currentColor" x="290" y="136" font-size="16" text-anchor="middle">2</text><path d="M365 110L365 110" stroke="var(--figure-blue,#17657a)" fill="none" stroke-width="2" /><text fill="currentColor" x="365" y="136" font-size="16" text-anchor="middle">3</text><text fill="currentColor" x="40" y="205" font-size="19" text-anchor="middle">y[n]</text><path d="M110 200L420 200" stroke="currentColor" fill="none" stroke-width="2" /><path d="M140 200L140 200" stroke="var(--figure-orange,#a95d17)" fill="none" stroke-width="2" /><text fill="currentColor" x="140" y="226" font-size="16" text-anchor="middle">0</text><path d="M215 200L215 200" stroke="var(--figure-orange,#a95d17)" fill="none" stroke-width="2" /><text fill="currentColor" x="215" y="226" font-size="16" text-anchor="middle">1</text><path d="M290 200L290 200" stroke="var(--figure-orange,#a95d17)" fill="none" stroke-width="2" /><text fill="currentColor" x="290" y="226" font-size="16" text-anchor="middle">2</text><path d="M365 200L365 145" stroke="var(--figure-orange,#a95d17)" fill="none" stroke-width="2" /><text fill="currentColor" x="365" y="226" font-size="16" text-anchor="middle">3</text><path d="M500 70L500 230" stroke="currentColor" fill="none" stroke-width="2" /><path d="M500 230L750 230" stroke="currentColor" fill="none" stroke-width="2" /><path d="M660 230L660 95" stroke="var(--figure-blue,#17657a)" fill="none" stroke-width="2" /><text fill="currentColor" x="660" y="260" font-size="19" text-anchor="middle">lag = +2</text><text fill="currentColor" x="615" y="300" font-size="17" text-anchor="middle">r_xy[ℓ] = Σ x[n] y[n+ℓ]</text></svg>
