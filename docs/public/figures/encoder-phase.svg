<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="encoderphaset encoderphased"><title id="encoderphaset">正交编码器的四分之一周期</title><desc id="encoderphased">A B两路同周期方波，相位错开四分之一周期，即π除以2。图示A先上升；反向时先后次序反转。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><text fill="currentColor" x="400" y="30" font-size="19" text-anchor="middle">同一机械周期，四个边沿状态用于辨方向</text><text fill="currentColor" x="45" y="90" font-size="19" text-anchor="middle">A</text><text fill="currentColor" x="45" y="205" font-size="19" text-anchor="middle">B</text><path d="M90 110H180V65H380V110H580V65H740" fill="none" stroke="var(--figure-blue,#17657a)" stroke-width="3"/><path d="M90 220H280V175H480V220H680V175H740" fill="none" stroke="var(--figure-orange,#a95d17)" stroke-width="3" stroke-dasharray="9 4"/><path d="M180 130L280 130" stroke="currentColor" fill="none" stroke-width="2" /><text fill="currentColor" x="230" y="153" font-size="19" text-anchor="middle">T / 4</text><path d="M180 245L580 245" stroke="currentColor" fill="none" stroke-width="2" /><text fill="currentColor" x="380" y="275" font-size="19" text-anchor="middle">周期 T</text><text fill="currentColor" x="400" y="315" font-size="19" text-anchor="middle">00 → 10 → 11 → 01 → 00（先声明A/B位序）</text></svg>
