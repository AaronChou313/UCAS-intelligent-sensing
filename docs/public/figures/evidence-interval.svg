<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="evidenceintervalt evidenceintervald"><title id="evidenceintervalt">信任与似然界之间保留未确定质量</title><desc id="evidenceintervald">示例识别框架E为空、F为占用。m(E)=0.2,m(F)=0.5,m(全集)=0.3。Bel(F)=0.5，Pl(F)=0.8。不是课件未归一化表的替代原值。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><text fill="currentColor" x="400" y="40" font-size="19" text-anchor="middle">同一教学示例：m(E)=0.2，m(F)=0.5，m(Θ)=0.3</text><path d="M80 160L720 160" stroke="currentColor" fill="none" stroke-width="2" /><path d="M400 135L400 185" stroke="var(--figure-blue,#17657a)" fill="none" stroke-width="2" /><path d="M592 135L592 185" stroke="var(--figure-orange,#a95d17)" fill="none" stroke-width="2" /><path d="M400 160H592" stroke="var(--figure-blue,#17657a)" stroke-width="9"/><text fill="currentColor" x="80" y="200" font-size="19" text-anchor="middle">0</text><text fill="currentColor" x="720" y="200" font-size="19" text-anchor="middle">1</text><text fill="currentColor" x="400" y="115" font-size="19" text-anchor="middle">Bel(F)=0.5</text><text fill="currentColor" x="592" y="115" font-size="19" text-anchor="middle">Pl(F)=0.8</text><text fill="currentColor" x="400" y="280" font-size="19" text-anchor="middle">区间宽度反映尚未明确分配到单个命题的证据。</text></svg>
