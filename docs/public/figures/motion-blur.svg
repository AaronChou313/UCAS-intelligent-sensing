<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="motionblurt motionblurd"><title id="motionblurt">曝光期间移动了多少像素</title><desc id="motionblurd">合成示意。速度2000毫米每秒，像素密度1360/70像素每毫米。两种曝光分别约0.836和1.671像素拖影。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><text fill="currentColor" x="400" y="35" font-size="19" text-anchor="middle">相同速度与尺度，只改变曝光时间</text><text fill="currentColor" x="170" y="110" font-size="19" text-anchor="middle">21.5 μs</text><text fill="currentColor" x="170" y="220" font-size="19" text-anchor="middle">43 μs</text><rect x="310" y="70" width="108.60576999999999" height="60" fill="var(--figure-blue,#17657a)" opacity=".25"/><path d="M310 70L310 130" stroke="currentColor" fill="none" stroke-width="2" /><path d="M418.60577 70L418.60577 130" stroke="currentColor" fill="none" stroke-width="2" /><text fill="currentColor" x="650" y="107" font-size="19" text-anchor="middle">0.836 pixel</text><rect x="310" y="180" width="217.21141" height="60" fill="var(--figure-orange,#a95d17)" opacity=".25"/><path d="M310 180L310 240" stroke="currentColor" fill="none" stroke-width="2" /><path d="M527.21141 180L527.21141 240" stroke="currentColor" fill="none" stroke-width="2" /><text fill="currentColor" x="650" y="217" font-size="19" text-anchor="middle">1.671 pixel</text><text fill="currentColor" x="400" y="305" font-size="19" text-anchor="middle">条带长度表示曝光位移，非实际缺陷形状。</text></svg>
