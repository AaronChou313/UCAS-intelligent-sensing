<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="pinholet pinholed"><title id="pinholet">针孔投影的相似三角形</title><desc id="pinholed">采用光心前方虚像平面，示意不按真实物理比例。空间点X,Z与像平面坐标x,f满足x/f=X/Z。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><path d="M90 250L710 250" stroke="currentColor" fill="none" stroke-width="2" /><path d="M220 40L220 275" stroke="currentColor" fill="none" stroke-width="2" /><path d="M640 40L640 275" stroke="currentColor" fill="none" stroke-width="2" /><path d="M110 250L640 125" stroke="var(--figure-blue,#17657a)" fill="none" stroke-width="2" /><path d="M110 250L640 250" stroke="currentColor" fill="none" stroke-width="2" /><text fill="currentColor" x="95" y="275" font-size="19" text-anchor="middle">O</text><text fill="currentColor" x="220" y="305" font-size="19" text-anchor="middle">虚像平面 Z=f</text><text fill="currentColor" x="640" y="305" font-size="19" text-anchor="middle">物点深度 Z</text><text fill="currentColor" x="250" y="200" font-size="19" text-anchor="middle">x</text><text fill="currentColor" x="675" y="185" font-size="19" text-anchor="middle">X</text><text fill="currentColor" x="425" y="35" font-size="19" text-anchor="middle">x / f = X / Z，像素化还需要内参</text></svg>
