<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="bootsequencet bootsequenced"><title id="bootsequencet">启动资源依赖</title><desc id="bootsequenced">示意顺序不等于所有芯片固定实现。复位入口建立最低硬件环境，准备内存后加载后续软件，再进入内核应用。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><rect x="30" y="50" width="145" height="60" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="102.5" y="87" font-size="19" text-anchor="middle">复位 / 固件</text><path d="M175 80L215 80" stroke="currentColor" fill="none" stroke-width="2" /><path d="M207 75L215 80L207 85" fill="none" stroke="currentColor" stroke-width="2"/><rect x="215" y="50" width="190" height="60" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="310" y="87" font-size="19" text-anchor="middle">时钟、内存、栈</text><path d="M405 80L445 80" stroke="currentColor" fill="none" stroke-width="2" /><path d="M437 75L445 80L437 85" fill="none" stroke="currentColor" stroke-width="2"/><rect x="445" y="50" width="150" height="60" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="520" y="87" font-size="19" text-anchor="middle">加载与校验</text><path d="M595 80L635 80" stroke="currentColor" fill="none" stroke-width="2" /><path d="M627 75L635 80L627 85" fill="none" stroke="currentColor" stroke-width="2"/><rect x="635" y="50" width="135" height="60" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="702.5" y="87" font-size="19" text-anchor="middle">内核 / 应用</text><rect x="240" y="195" width="320" height="60" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="400" y="232" font-size="19" text-anchor="middle">先准备资源，再运行依赖它的代码</text><path d="M310 110L310 195" stroke="currentColor" fill="none" stroke-width="2" /><text fill="currentColor" x="400" y="300" font-size="19" text-anchor="middle">保存地址、执行地址与启动交接条件必须一致。</text></svg>
