<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="pcanormalt pcanormald"><title id="pcanormalt">法线是局部变化最小的方向</title><desc id="pcanormald">二维直线邻域示意，三维情况下用局部点协方差最小特征值对应向量估计法线。法线有正负二义性。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><path d="M100 260L680 70" stroke="var(--figure-blue,#17657a)" fill="none" stroke-width="2" /><text fill="currentColor" x="400" y="35" font-size="19" text-anchor="middle">局部切向变化大，法向变化小</text><circle cx="140" cy="247" r="5" fill="currentColor"/><circle cx="198" cy="228" r="5" fill="currentColor"/><circle cx="256" cy="209" r="5" fill="currentColor"/><circle cx="314" cy="190" r="5" fill="currentColor"/><circle cx="372" cy="171" r="5" fill="currentColor"/><circle cx="430" cy="152" r="5" fill="currentColor"/><circle cx="488" cy="133" r="5" fill="currentColor"/><circle cx="546" cy="114" r="5" fill="currentColor"/><circle cx="604" cy="95" r="5" fill="currentColor"/><path d="M390 166L350 44" stroke="var(--figure-orange,#a95d17)" fill="none" stroke-width="2" /><text fill="currentColor" x="308" y="65" font-size="19" text-anchor="middle">法线 n</text><path d="M390 166L500 130" stroke="var(--figure-blue,#17657a)" fill="none" stroke-width="2" /><text fill="currentColor" x="555" y="128" font-size="19" text-anchor="middle">切向</text><text fill="currentColor" x="400" y="310" font-size="19" text-anchor="middle">PCA法线对应局部协方差的最小特征值方向。</text></svg>
