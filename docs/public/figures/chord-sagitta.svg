<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="chordsagittat chordsagittad"><title id="chordsagittat">弦长和弓高确定圆直径</title><desc id="chordsagittad">圆的几何示意。弦长s、弓高h满足D=s平方除以4h加h。弓高从弦到近侧圆弧，直径跨越整圆。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><circle cx="400" cy="210" r="170" fill="none" stroke="currentColor" stroke-width="2"/><path d="M270.385 100L529.615 100" stroke="var(--figure-blue,#17657a)" fill="none" stroke-width="2" /><path d="M400 40L560 40" stroke="currentColor" fill="none" stroke-width="2" stroke-dasharray="4 4"/><path d="M529.615 100L580 100" stroke="currentColor" fill="none" stroke-width="2" stroke-dasharray="4 4"/><path d="M560 40L560 100" stroke="var(--figure-orange,#a95d17)" fill="none" stroke-width="2" /><text fill="currentColor" x="585" y="78" font-size="19" text-anchor="middle">h</text><text fill="currentColor" x="400" y="128" font-size="19" text-anchor="middle">弦长 s</text><path d="M210 40L210 380" stroke="currentColor" fill="none" stroke-width="2" /><path d="M210 40L400 40" stroke="currentColor" fill="none" stroke-width="2" stroke-dasharray="4 4"/><path d="M210 380L400 380" stroke="currentColor" fill="none" stroke-width="2" stroke-dasharray="4 4"/><text fill="currentColor" x="180" y="215" font-size="19" text-anchor="middle">D</text><path d="M400 210L529.615 100" stroke="currentColor" fill="none" stroke-width="2" stroke-dasharray="4 4"/><text fill="currentColor" x="470" y="180" font-size="19" text-anchor="middle">D / 2</text><text fill="currentColor" x="400" y="416" font-size="19" text-anchor="middle">h 是局部高度，D 是整圆直径，二者不可互换。</text></svg>
