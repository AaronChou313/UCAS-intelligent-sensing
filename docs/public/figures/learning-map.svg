<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="learningmapt learningmapd"><title id="learningmapt">课程知识依赖</title><desc id="learningmapd">第一章建立测量语言，第二章器件、第三章平台、第四章数据处理构成基础，视觉点云听觉进入融合。箭头只表示主要学习依赖。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><rect x="20" y="30" width="175" height="55" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="107.5" y="64.5" font-size="19" text-anchor="middle">一 测量语言</text><path d="M195 57L225 57" stroke="currentColor" fill="none" stroke-width="2" /><path d="M217 52L225 57L217 62" fill="none" stroke="currentColor" stroke-width="2"/><rect x="225" y="30" width="165" height="55" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="307.5" y="64.5" font-size="19" text-anchor="middle">二 物理器件</text><path d="M390 57L420 57" stroke="currentColor" fill="none" stroke-width="2" /><path d="M412 52L420 57L412 62" fill="none" stroke="currentColor" stroke-width="2"/><rect x="420" y="30" width="165" height="55" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="502.5" y="64.5" font-size="19" text-anchor="middle">三 实现平台</text><path d="M585 57L615 57" stroke="currentColor" fill="none" stroke-width="2" /><path d="M607 52L615 57L607 62" fill="none" stroke="currentColor" stroke-width="2"/><rect x="615" y="30" width="165" height="55" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="697.5" y="64.5" font-size="19" text-anchor="middle">四 可信数据</text><path d="M697 85L697 130" stroke="currentColor" fill="none" stroke-width="2" /><path d="M100 130L697 130" stroke="currentColor" fill="none" stroke-width="2" /><path d="M100 130L100 180" stroke="currentColor" fill="none" stroke-width="2" /><rect x="15" y="180" width="170" height="55" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="100" y="214.5" font-size="19" text-anchor="middle">五 视觉几何</text><path d="M330 130L330 180" stroke="currentColor" fill="none" stroke-width="2" /><rect x="245" y="180" width="170" height="55" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="330" y="214.5" font-size="19" text-anchor="middle">六 点云几何</text><path d="M560 130L560 180" stroke="currentColor" fill="none" stroke-width="2" /><rect x="475" y="180" width="170" height="55" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="560" y="214.5" font-size="19" text-anchor="middle">七 声波时差</text><path d="M100 235L100 275" stroke="currentColor" fill="none" stroke-width="2" /><path d="M330 235L330 275" stroke="currentColor" fill="none" stroke-width="2" /><path d="M560 235L560 275" stroke="currentColor" fill="none" stroke-width="2" /><path d="M100 275L560 275" stroke="currentColor" fill="none" stroke-width="2" /><path d="M330 275L330 305" stroke="currentColor" fill="none" stroke-width="2" /><rect x="240" y="305" width="180" height="55" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="330" y="339.5" font-size="19" text-anchor="middle">八 多源融合</text></svg>
