<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="icpt icpd"><title id="icpt">ICP的两个交替步骤</title><desc id="icpd">先按当前变换找对应，再固定对应求刚体变换，反复更新。初值、重叠与异常点影响结果，不保证全局最优。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><rect x="40" y="90" width="240" height="80" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="160" y="137" font-size="19" text-anchor="middle">当前位姿下寻找对应</text><path d="M280 130L460 130" stroke="currentColor" fill="none" stroke-width="2" /><path d="M452 125L460 130L452 135" fill="none" stroke="currentColor" stroke-width="2"/><rect x="460" y="90" width="290" height="80" rx="4" fill="none" stroke="currentColor"/><text fill="currentColor" x="605" y="137" font-size="19" text-anchor="middle">固定对应求刚体变换</text><path d="M610 170L610 235" stroke="currentColor" fill="none" stroke-width="2" /><path d="M610 235L160 235" stroke="currentColor" fill="none" stroke-width="2" /><path d="M160 235L160 170" stroke="currentColor" fill="none" stroke-width="2" /><text fill="currentColor" x="400" y="275" font-size="19" text-anchor="middle">循环直到满足停止条件；需检查退化和错误对应。</text></svg>
