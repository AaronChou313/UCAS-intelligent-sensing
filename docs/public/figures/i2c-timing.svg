<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="i2ctimingt i2ctimingd"><title id="i2ctimingt">I2C稳定窗口与起停条件</title><desc id="i2ctimingd">蓝色为SDA，灰色为SCL。START是SCL高时SDA下降，STOP是SCL高时SDA上升。普通数据在SCL低时改变。</desc><style>text{fill:currentColor;font-family:system-ui,sans-serif}.a{stroke:var(--figure-blue,#17657a)}.b{stroke:var(--figure-orange,#a95d17)}</style><text fill="currentColor" x="400" y="30" font-size="19" text-anchor="middle">SCL 高时，普通数据必须保持稳定</text><text fill="currentColor" x="35" y="95" font-size="17" text-anchor="middle">SCL</text><text fill="currentColor" x="35" y="180" font-size="17" text-anchor="middle">SDA</text><path d="M90 70H200V110H245V70H300V110H345V70H400V110H445V70H500V110H545V70H710" fill="none" stroke="currentColor" stroke-width="2"/><path d="M90 155H150V195H220V155H320V195H600V155H710" fill="none" stroke="var(--figure-blue,#17657a)" stroke-width="3"/><path d="M150 45L150 215" stroke="var(--figure-orange,#a95d17)" fill="none" stroke-width="2" stroke-dasharray="4 4"/><path d="M600 45L600 215" stroke="var(--figure-orange,#a95d17)" fill="none" stroke-width="2" stroke-dasharray="4 4"/><text fill="currentColor" x="150" y="250" font-size="19" text-anchor="middle">START</text><text fill="currentColor" x="600" y="250" font-size="19" text-anchor="middle">STOP</text><text fill="currentColor" x="400" y="300" font-size="19" text-anchor="middle">只画示意位段，未绘完整地址、8位数据与ACK。</text></svg>
